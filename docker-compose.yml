services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mantenimiento
      POSTGRES_USER: mantenimiento
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mantenimiento}
    ports:
      - "5432:5432"
    volumes:
      - mantenimiento_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantenimiento -d mantenimiento"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/mantenimiento
      DB_USERNAME: mantenimiento
      DB_PASSWORD: ${DB_PASSWORD:-mantenimiento}
      DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mantenimiento_data:
