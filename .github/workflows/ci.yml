name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar verificaciones
        run: ./mvnw -B verify

      - name: Reportar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## CI: éxito" >> "$GITHUB_STEP_SUMMARY"
            echo "La compilación y las verificaciones terminaron correctamente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI: fallo" >> "$GITHUB_STEP_SUMMARY"
            echo "La compilación o alguna verificación falló." >> "$GITHUB_STEP_SUMMARY"
          fi
